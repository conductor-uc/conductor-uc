# Local development stack (S0-05). MariaDB, Redis, NATS (JetStream), MinIO,
# Mailpit, and (from S1-10/S1-11) FreeSWITCH and OpenSIPs. Both projections
# (usrloc, dispatcher, domain, ...) are empty until telephony-config (S1-12)
# exists — every routing decision in opensips.cfg.template correctly finds
# nothing and falls through until then.
#
# Usage: see the root Makefile (`make up` / `make down` / `make reset`) or
# ./README.md for details and troubleshooting.
name: conductor-uc

services:
  mariadb:
    # Matches production and CI (05 §1, .github/workflows/ci.yml): a test or
    # a dev session against a different major is not evidence about prod.
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-dev-root-password}
      IDENTITY_SERVICE_DB_PASSWORD: ${IDENTITY_SERVICE_DB_PASSWORD:-dev-identity-password}
      ORG_SERVICE_DB_PASSWORD: ${ORG_SERVICE_DB_PASSWORD:-dev-org-password}
      PBX_CONFIG_SERVICE_DB_PASSWORD: ${PBX_CONFIG_SERVICE_DB_PASSWORD:-dev-pbx-config-password}
      EXAMPLE_SERVICE_DB_PASSWORD: ${EXAMPLE_SERVICE_DB_PASSWORD:-dev-example-password}
      TELEPHONY_CONFIG_SERVICE_DB_PASSWORD: ${TELEPHONY_CONFIG_SERVICE_DB_PASSWORD:-dev-telephony-config-password}
      TRUNK_SERVICE_DB_PASSWORD: ${TRUNK_SERVICE_DB_PASSWORD:-dev-trunk-service-password}
      OPENSIPS_DB_PASSWORD: ${OPENSIPS_DB_PASSWORD:-dev-opensips-password}
    ports:
      - '${MARIADB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
      # Only runs against an empty data directory (the image's own rule), so
      # editing this after the first `make up` needs `make reset` to apply.
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      # S1-11: OpenSIPs' own vendored table-creation SQL, read by
      # 02-opensips-schema.sh above (see telephony/opensips/db-schema/README.md).
      - ../../telephony/opensips/db-schema:/opensips-schema:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # -js enables JetStream (D-004); -sd points its store at the volume so
    # streams survive a restart; -m exposes the monitoring/health endpoint.
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # The image wires its own `mc` client to a `local` alias against its
      # own server, so this needs no extra setup.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  freeswitch:
    # S1-10. telephony/freeswitch's own Dockerfile builds a minimal, neutral
    # image from scratch — see it for why (the upstream package repo now
    # requires authentication).
    build:
      context: ../../telephony/freeswitch
    restart: unless-stopped
    environment:
      # Compose's default bridge subnet is assigned dynamically, so this is
      # deliberately broad rather than one fixed address — it still only
      # covers this project's own isolated network, never the host's.
      FS_OPENSIPS_CIDR: ${FS_OPENSIPS_CIDR:-172.16.0.0/12}
      FS_CLUSTER_CIDR: ${FS_CLUSTER_CIDR:-172.16.0.0/12}
      FS_EVENT_SOCKET_PASSWORD: ${FS_EVENT_SOCKET_PASSWORD:-dev-event-socket-password}
      TELEPHONY_CONFIG_URL: ${TELEPHONY_CONFIG_URL:-http://telephony-config:8080}
      FS_XML_CURL_TOKEN: ${FS_XML_CURL_TOKEN:-dev-internal-token}
    # No host port publish: 03 §1's table lists OpenSIPs as the only edge —
    # FS is reached over the compose network (its ACL only allows
    # opensips_cidr/cluster_cidr, S1-10), same as production. The dispatcher
    # module (below) is what actually sends it traffic.
    tmpfs:
      # 06's recording pipeline spool. Never a named volume — nothing
      # durable lives on a FreeSWITCH node (CLAUDE.md rule 5).
      - /var/spool/cuc/rec

  opensips:
    # S1-11. telephony/opensips's own Dockerfile builds this from the
    # upstream opensips/opensips:3.6 image plus the extra modules 03 §2
    # needs — see it and opensips.cfg.template for the module-by-module
    # reasoning.
    build:
      context: ../../telephony/opensips
    restart: unless-stopped
    depends_on:
      mariadb:
        # The `opensips` schema (mariadb/init/01-schemas.sh,
        # 02-opensips-schema.sh) must exist before db_mysql-backed modules
        # try to connect at startup.
        condition: service_healthy
    environment:
      OPENSIPS_LOG_LEVEL: ${OPENSIPS_LOG_LEVEL:-3}
      OPENSIPS_IDENTITY: ${OPENSIPS_IDENTITY:-SIP Media Server}
      OPENSIPS_SIP_PORT: ${OPENSIPS_SIP_PORT:-5060}
      OPENSIPS_MI_PORT: ${OPENSIPS_MI_PORT:-8888}
      OPENSIPS_DB_URL: mysql://opensips:${OPENSIPS_DB_PASSWORD:-dev-opensips-password}@mariadb/opensips
      OPENSIPS_REDIS_URL: ${OPENSIPS_REDIS_URL:-redis:cuc://redis:6379/0}
      # S1-14 (G-18): seeded into `dispatcher` set 1 at container start
      # (seed-dispatcher.py) — one FS node in this stage. `route{}` also
      # uses this same set (`ds_is_from_list("1")`) to tell a request FS
      # sent back to us (ext→ext, 03 §2.1) apart from a registered phone
      # dialing out — a CIDR check was tried first and confirmed wrong on
      # this flat compose network (opensips.cfg.template's own comment).
      OPENSIPS_FS_DESTINATION: ${OPENSIPS_FS_DESTINATION:-sip:freeswitch:5060}
    ports:
      - '${OPENSIPS_SIP_PORT:-5060}:5060/udp'
      - '${OPENSIPS_SIP_PORT:-5060}:5060/tcp'

  org-service:
    # S1-14: the first Node service to actually run in this stack (09 §1's
    # "each service builds a single container image", never exercised until
    # a task needed real cross-service HTTP + event flow, not just each
    # service's own integration tests). `identity-service` deliberately does
    # not run here — tests/sip provisions fixtures through this service's
    # own repo layer directly (bypassing the admin-user side effect on
    # `POST /v1/.../tenants`, which SIP scenarios have no use for), so
    # nothing in this stack ever calls out to it.
    build:
      context: ../..
      dockerfile: services/org-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      SERVICE_NAME: org-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: org_service
      DB_PASSWORD: ${ORG_SERVICE_DB_PASSWORD:-dev-org-password}
      DB_NAME: org_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # Unreachable on purpose (see the note above) — org-service's own
      # config still requires a syntactically valid URL to boot.
      IDENTITY_SERVICE_URL: http://127.0.0.1:1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-platform.test}
      STORAGE_BUCKET_PREFIX: cuc-dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-minio}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
      STORAGE_FORCE_PATH_STYLE: 'true'

  pbx-config-service:
    build:
      context: ../..
      dockerfile: services/pbx-config-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      org-service:
        condition: service_started
    environment:
      SERVICE_NAME: pbx-config-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: pbx_config_service
      DB_PASSWORD: ${PBX_CONFIG_SERVICE_DB_PASSWORD:-dev-pbx-config-password}
      DB_NAME: pbx_config_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      ORG_SERVICE_URL: http://org-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Dev-only KEK (packages/crypto/src/config.ts) — production uses a KMS.
      CRYPTO_KEKS: ${CRYPTO_KEKS:-1:u4SpMlDTAL6cVMC2rzCxhoKCRAJxpgoc7h+hX3OfdfY=}
      CRYPTO_KEK_CURRENT: '1'

  trunk-service:
    build:
      context: ../..
      dockerfile: services/trunk-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      org-service:
        condition: service_started
    environment:
      SERVICE_NAME: trunk-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: trunk_service
      DB_PASSWORD: ${TRUNK_SERVICE_DB_PASSWORD:-dev-trunk-service-password}
      DB_NAME: trunk_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      ORG_SERVICE_URL: http://org-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Dev-only KEK (packages/crypto/src/config.ts) — production uses a KMS.
      CRYPTO_KEKS: ${CRYPTO_KEKS:-1:u4SpMlDTAL6cVMC2rzCxhoKCRAJxpgoc7h+hX3OfdfY=}
      CRYPTO_KEK_CURRENT: '1'

  telephony-config:
    build:
      context: ../..
      dockerfile: services/telephony-config/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      org-service:
        condition: service_started
      pbx-config-service:
        condition: service_started
    environment:
      SERVICE_NAME: telephony-config
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: telephony_config
      DB_PASSWORD: ${TELEPHONY_CONFIG_SERVICE_DB_PASSWORD:-dev-telephony-config-password}
      DB_NAME: telephony_config
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      OPENSIPS_DB_HOST: mariadb
      OPENSIPS_DB_PORT: 3306
      OPENSIPS_DB_USER: opensips
      OPENSIPS_DB_PASSWORD: ${OPENSIPS_DB_PASSWORD:-dev-opensips-password}
      OPENSIPS_DB_NAME: opensips
      OPENSIPS_MI_URL: http://opensips:${OPENSIPS_MI_PORT:-8888}/mi
      OPENSIPS_SIP_URI: opensips:${OPENSIPS_SIP_PORT:-5060}
      PBX_CONFIG_SERVICE_URL: http://pbx-config-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      FS_XML_CURL_TOKEN: ${FS_XML_CURL_TOKEN:-dev-internal-token}
      RECONCILE_INTERVAL_MS: '900000'

volumes:
  mariadb-data:
  redis-data:
  nats-data:
  minio-data:
  mailpit-data:
