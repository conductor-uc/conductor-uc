name: CI

# Nightly and on demand only (owner decision, G-110): no run on a pull request or
# on a push. The suite takes long enough on the self-hosted runner that a run per
# PR slowed development down more than it helped. Every run tests everything:
# the nightly run says whether `main` is green, and "Run workflow"
# (`workflow_dispatch`) runs the same thing by hand when a merge needs checking
# sooner. CodeQL runs separately and still checks every pull request.
#
# The price: a pull request merges untested, and a break shows up at the next
# nightly run (or a manual one), not before the merge.
on:
  workflow_dispatch:
  # S2-20 (issue #44): the full `tests/sip` suite runs here too. 06:00 UTC is
  # simply outside this project's working hours.
  schedule:
    - cron: '0 6 * * *'

# A manual run started while another is going queues behind it rather than
# cancelling it: both test `main`, and a half-finished run tells nobody anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Integration tests skip when no database or broker is reachable, so that
  # `pnpm test` stays usable on a laptop without Docker. In CI a missing
  # dependency must fail the run instead: without these, a broken service
  # container would report green with every integration test silently skipped.
  REQUIRE_DB_TESTS: '1'
  REQUIRE_NATS_TESTS: '1'
  REQUIRE_S3_TESTS: '1'
  REQUIRE_REDIS_TESTS: '1'
  REQUIRE_SMTP_TESTS: '1'
  TEST_DATABASE_URL: mysql://root:ci@127.0.0.1:3306
  TEST_S3_URL: http://ci-minio:ci-minio-password@127.0.0.1:9000
  TEST_REDIS_URL: redis://127.0.0.1:6379
  TEST_MAILPIT_URL: http://127.0.0.1:8025
  TEST_SMTP_HOST: 127.0.0.1
  TEST_SMTP_PORT: '1025'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: lint, typecheck, test, build
    # GitHub-hosted: only the `sip` job needs the self-hosted runner's
    # headroom (see its comment), and keeping this off it lets the two run
    # at the same time instead of queueing behind each other.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The live SIP suite belongs to the `sip` job. When this job shared the
      # self-hosted runner, it ran here against that job's stack whenever the
      # compose network happened to exist (run #286); kept so it never can.
      SKIP_SIP_TESTS: '1'

    services:
      mariadb:
        # Matches production (05 §1). A test that passes against a different
        # major is not evidence about production.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      mailpit:
        # notification-service's tests send through this and read what arrived
        # over its HTTP API (S3-03).
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget -qO- http://127.0.0.1:8025/readyz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install nats-server
        # Every suite that needs a bus starts its own JetStream server from this
        # binary (`packages/testing/src/nats.ts`), on a free port with its own
        # store. One shared server let two packages' tests, which turbo runs at
        # the same time, purge each other's `ORG`, `PBX` and `AUDIT` streams: an
        # event published by one was gone before its consumer pulled it, and the
        # test waited out its 15 s of retries and failed (G-17). The version
        # matches the `nats:2.10` line production runs.
        run: |
          version=v2.10.29
          sha256=e314da74a83a1d3876db8814c27eb990fe729640fd6452025b441bcede8390da
          dir="$RUNNER_TOOL_CACHE/nats-server/$version"
          if [ ! -x "$dir/nats-server" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/nats.tgz" \
              "https://github.com/nats-io/nats-server/releases/download/$version/nats-server-$version-linux-amd64.tar.gz"
            echo "$sha256  $tmp/nats.tgz" | sha256sum -c -
            tar -xzf "$tmp/nats.tgz" -C "$tmp"
            mkdir -p "$dir"
            install -m 0755 "$tmp/nats-server-$version-linux-amd64/nats-server" "$dir/nats-server.new"
            mv "$dir/nats-server.new" "$dir/nats-server"
            rm -rf "$tmp"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/nats-server" --version

      - name: Start MinIO
        # Not a `services:` entry: the image needs a `server /data` command,
        # and a service container has no way to pass one. Without this,
        # @cuc/storage's tests fall back to Testcontainers pulling the image
        # cold, which routinely outruns vitest's default hook timeout here.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-password \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; then
              echo "MinIO is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not start in time" >&2
          docker logs minio >&2
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, typecheck, test, build (all)
        run: pnpm check

      - name: Console OpenAPI snapshot is current
        # apps/console/api/openapi.json is dumped from the services' own route
        # schemas, and the console's contract test compares its screens against
        # it. Building every service `dump-openapi.mjs` imports (the eight in its
        # SOURCES list) here, rather than relying on the step above, keeps this
        # step correct on its own; the builds are cache hits after `pnpm check`.
        run: |
          pnpm exec turbo run build --filter=@cuc/pbx-config-service --filter=@cuc/callflow-service --filter=@cuc/identity-service --filter=@cuc/org-service --filter=@cuc/trunk-service --filter=@cuc/voicemail-service --filter=@cuc/cdr-service --filter=@cuc/recording-service --filter=@cuc/api-gateway
          node apps/console/tool/dump-openapi.mjs
          git diff --exit-code -- apps/console/api/openapi.json

      - name: Console problem-code catalog is current
        # S9-02: the console translates problems by code, and its tests check
        # each translated code against this list of what the services send.
        run: |
          node apps/console/tool/dump-problem-codes.mjs
          git diff --exit-code -- apps/console/api/problem-codes.json

      - name: Console call-flow IR snapshot is current
        # apps/console/api/callflow-ir.json holds what the call-flow builder
        # must agree with @cuc/callflow-ir on (node schemas, ports, validator
        # verdicts); the console's tests compare the builder against it.
        run: |
          pnpm exec turbo run build --filter=@cuc/callflow-ir
          node apps/console/tool/dump-callflow-ir.mjs
          git diff --exit-code -- apps/console/api/callflow-ir.json

      - name: Brand-leak scan
        # Rule 1 in CLAUDE.md: no branding on any user-facing or network-visible
        # surface. Runs after build so it sees built artifacts as well as sources.
        run: pnpm brand-leak

      - name: Show MinIO logs on failure
        if: failure()
        run: docker logs minio || true

  # A separate job, not a step in `check` above, so the slowest suite (real SIP
  # transaction timers over real UDP) runs alongside the other jobs instead of
  # after them.
  sip:
    name: SIP full suite (S2-20)
    # Tried moving this to ubuntu-latest on 2026-09-22 to escape the
    # self-hosted runner's slow per-layer Docker overhead (see the timeout
    # comment below). Reverted the same day: the very first hosted run hit
    # G-34's exact documented signature (trunk registration stuck
    # 'unknown', a routing scenario timing out) instead of the layer-commit
    # slowness — hosted tenancy's 2 vCPUs still can't keep up with this
    # compose stack, which has only gotten heavier since G-34 and 84f3ec4
    # were written. Back to self-hosted; the layer-commit overhead is the
    # better problem to have.
    runs-on: self-hosted
    # Was 20. Confirmed live (2026-09-22): a single `pnpm ... --prod deploy
    # --legacy` step's own work finishes in ~5s, but the Docker layer
    # commit/export around it took ~260s on this runner — not a hang, just
    # this runner's per-layer overhead. Stage 2 added several new services
    # (call-control, callflow-service, voicemail-service) to the compose
    # stack in one batch, each needing a from-scratch, uncached image on
    # top of that overhead; 20 minutes was not enough headroom for the
    # whole stack to build even once nothing is actually stuck.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # This runner can be the machine a developer's own stack is on. Under
      # the compose file's fixed project name the two were one project, and
      # this job's `down -v` removed the dev stack and its volumes. ci.env
      # gives this job's stack its own project, subnet and host ports; loaded
      # here, compose and the suite both see it in every later step.
      - name: Use CI's own compose project
        run: grep -vE '^[[:space:]]*(#|$)' infra/compose/ci.env >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `tests/sip`'s own seed step (`run-scenario.ts`'s `seedFixtures`)
      # runs `dist/src/seed.js` inside a throwaway container that bind-mounts
      # this checkout — it needs the compiled output on disk, not just a
      # turbo cache entry elsewhere, so this must happen before the stack
      # comes up.
      - name: Build tests/sip and its workspace dependencies
        run: pnpm exec turbo run build --filter=@cuc/tests-sip...

      # `--wait` blocks until every service satisfies its own
      # `depends_on: condition:` (S1-14's own compose file) or, for FS/
      # OpenSIPs, the Docker-level `HEALTHCHECK` baked into their own
      # Dockerfiles — the same readiness signal `make up` relies on locally.
      - name: Build and start the compose stack
        working-directory: infra/compose
        env:
          # The uploaders otherwise wait 30 s for a finished recording or
          # voicemail to settle, which about 25 SIP tests pay in full (~10 of
          # the suite's ~27 min). A file FreeSWITCH still has open is refused
          # by its WAV header check whatever this is; the settle time is a
          # second margin, kept short here rather than removed.
          RECORDING_SETTLE_SECONDS: '5'
          RECORDING_SCAN_INTERVAL_MS: '1000'
          # telephony-config reuses a recording decision for 30 s, so a rule
          # a test just created or deleted can be ignored for that long. The
          # S5-13 tests make the same 402 -> 401 call under a different rule
          # each; with the short settle above they run within 30 s of each
          # other and got the previous test's decision.
          RECORDING_POLICY_CACHE_TTL_MS: '1000'
        run: |
          # Clean slate first. Every SIP job on this self-hosted runner
          # shares one compose project (ci.env's `conductor-uc-ci`), one
          # network and one set of container names. The runner serializes
          # jobs, but only just: observed live on 2026-09-22, one job started **one second**
          # after the previous job's `docker compose down -v` step
          # finished, and its whole run then failed with
          # `getaddrinfo EAI_AGAIN mariadb` — every test file, including
          # the seed step, unable to resolve anything on the compose
          # network, because the previous teardown was still removing that
          # network while this `up` recreated it.
          #
          # `down -v` here is idempotent (a no-op when nothing is left) and
          # synchronous, so `up` below always starts from a settled state
          # rather than racing whatever the previous job left mid-removal.
          docker rm -f "$SIP_TEST_CURL_CONTAINER" >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans
          docker compose build
          docker compose up -d --wait --wait-timeout 180

      - name: Run full SIP suite
        working-directory: tests/sip
        env:
          # A missing/broken compose stack must fail this job, not report a
          # green run full of skipped tests — same pattern as the `check`
          # job's own REQUIRE_DB_TESTS etc. above.
          REQUIRE_SIP_TESTS: '1'
        # `verbose` prints every test with its duration, so a slow test (or a
        # retried one) shows in the log without a local rerun.
        run: pnpm vitest run --reporter=verbose

      # The recurring flake this suite keeps hitting (docs/decisions.md
      # G-39) is a call whose BYE never reaches the UAS, with FreeSWITCH's
      # own log showing neither leg ever torn down. `docker compose logs`
      # below cannot answer the question that would actually root-cause it:
      # what FS itself thought the state was at the moment of failure.
      # These three do, and cost nothing on a passing run.
      #
      # S2-19: both nodes, not just the first — round-robin dispatch means
      # a stuck call could be on either one, the same reasoning
      # `tests/sip/src/setup.ts`'s own `fsCliAll` now applies per-test.
      - name: Show FreeSWITCH call state on failure
        if: failure()
        run: |
          fs() {
            container="$1"; shift
            docker exec "$container" fs_cli -H 127.0.0.1 -P 8021 \
              -p "${FS_EVENT_SOCKET_PASSWORD:-dev-event-socket-password}" -x "$1" || true
          }
          for container in "${COMPOSE_PROJECT_NAME}-freeswitch-1" "${COMPOSE_PROJECT_NAME}-freeswitch-2-1"; do
            echo "=== $container ==="
            echo '--- channels still up (a stuck call shows here) ---'
            fs "$container" 'show channels'
            echo '--- registrations (is the UAS even registered where FS thinks?) ---'
            fs "$container" 'sofia status profile internal reg'
            echo '--- sofia profile state ---'
            fs "$container" 'sofia status'
          done

      - name: Show compose logs on failure
        if: failure()
        working-directory: infra/compose
        run: docker compose logs

      - name: Tear down the compose stack
        if: always()
        working-directory: infra/compose
        # The suite's curl container (`tests/sip/src/global-setup.ts`) is
        # removed by the suite itself, but not if the run was killed, and
        # while it is attached `down` cannot remove the network.
        run: |
          docker rm -f "$SIP_TEST_CURL_CONTAINER" >/dev/null 2>&1 || true
          docker compose down -v

  # S4-08: the chaos suite. The stack on the highly available data tier
  # (docker-compose.chaos.yml), then each failure 10 §5 plans for, one at a
  # time under call load, measured against its targets. Same runner and compose
  # project as `sip`, so it runs after it rather than beside it.
  chaos:
    name: Chaos suite (S4-08)
    needs: sip
    if: always()
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # This runner can be the machine a developer's own stack is on. Under
      # the compose file's fixed project name the two were one project, and
      # this job's `down -v` removed the dev stack and its volumes. ci.env
      # gives this job's stack its own project, subnet and host ports; loaded
      # here, compose and the suite both see it in every later step.
      - name: Use CI's own compose project
        run: grep -vE '^[[:space:]]*(#|$)' infra/compose/ci.env >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build tests/sip and its workspace dependencies
        run: pnpm exec turbo run build --filter=@cuc/tests-sip...

      - name: Build and start the chaos stack
        working-directory: infra/compose
        run: |
          docker rm -f "$SIP_TEST_CURL_CONTAINER" >/dev/null 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml down -v --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml build
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml up -d --wait --wait-timeout 400

      - name: Run the chaos suite
        working-directory: tests/sip
        env:
          REQUIRE_SIP_TESTS: '1'
          # The test helpers that read a schema directly use a Galera member,
          # not the load balancer the everyday `mariadb` name now points at.
          SIP_TEST_MARIADB_CONTAINER: ${{ env.COMPOSE_PROJECT_NAME }}-galera-2-1
        run: pnpm chaos --reporter=verbose

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: tests/sip/chaos-results/
          if-no-files-found: ignore

      - name: Show compose logs on failure
        if: failure()
        working-directory: infra/compose
        run: docker compose -f docker-compose.yml -f docker-compose.chaos.yml logs

      - name: Tear down the chaos stack
        if: always()
        working-directory: infra/compose
        run: |
          docker rm -f "$SIP_TEST_CURL_CONTAINER" chaos-load-caller chaos-load-callee >/dev/null 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml down -v --remove-orphans

  # The Flutter console (D-001): not a pnpm workspace member, so it has its own
  # job. brand-leak runs here, after `flutter build web`, because that is the
  # only place `apps/console/build/web` exists to be scanned.
  console:
    name: console (analyze, test, build web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate the API client and check it is committed
        # The client is generated from api/openapi.yaml (08 §1). A stale
        # checked-in copy would let the spec and the app drift apart.
        working-directory: apps/console
        env:
          OPENAPI_GENERATOR_JAR: ${{ runner.temp }}/openapi-generator-cli.jar
        run: |
          curl -fsSL -o "$OPENAPI_GENERATOR_JAR" \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.14.0/openapi-generator-cli-7.14.0.jar
          ./tool/generate-api.sh
          git diff --exit-code -- packages/console_api

      - run: flutter pub get
        working-directory: apps/console

      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/console

      - run: flutter analyze
        working-directory: apps/console

      # S9-01 (D-018): user-facing text lives in lib/l10n/app_en.arb. The
      # literals that predate it are counted per file and may only go down.
      - name: No new hard-coded strings
        run: node apps/console/tool/check-strings.mjs

      - run: flutter test
        working-directory: apps/console

      # Built the way production serves it (G-104): CanvasKit bundled, so the
      # gateway's Content-Security-Policy needs no CDN in it.
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: apps/console

      - run: pnpm install --frozen-lockfile

      - name: Brand-leak scan (includes build/web)
        run: pnpm brand-leak

  # Later stages plug in here rather than in the job above:
  #   - container image builds, pushed on main (S1)
