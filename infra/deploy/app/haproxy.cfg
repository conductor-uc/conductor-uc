# S4-11 (10 §4.1, D-017): the internal load balancer on each app server,
# listening on the pair's private floating address (APP_VIP, held by
# keepalived beside it: the edges and media servers use it) and on this
# server's own address (LB_OWN_IP: this server's own services use it, so they
# never depend on the other app server's balancer). The services themselves
# are on 9101-9112 on each app server. The addresses come from the container's environment
# (the app role's compose.yml passes them from platform.env).
global
  log stdout format raw local0 notice
  user haproxy
  group haproxy
  external-check
  insecure-fork-wanted

defaults
  log global
  timeout connect 2s
  timeout client 1h
  timeout server 1h
  # A connection that fails (a server just died, not yet marked down) is
  # retried on another server rather than the same one (found in the S4-11
  # rehearsal: a request sent to a dead app server's service got a 503).
  option redispatch
  retries 2
  default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

# ---------------------------------------------------------------- services
# Each on both app servers, checked on /readyz; a server that is not ready
# (starting, draining, its database unreachable) takes no requests.

frontend identity-service
  mode http
  bind "${APP_VIP}:8101"
  bind "${LB_OWN_IP}:8101"
  default_backend identity-service

backend identity-service
  mode http
  option httpchk GET /readyz
  http-check expect status 200
  server app1 "${APP1_IP}:9101" check
  server app2 "${APP2_IP}:9101" check

