# ---------------------------------------------------------------- data tier
# The MariaDB writer (D-016): one Galera member at a time, checked Synced and
# ready; the stick table keeps writes on the new writer when the old returns.
frontend mariadb
  mode tcp
  bind "${APP_VIP}:3306"
  bind "${LB_OWN_IP}:3306"
  default_backend galera

backend galera
  mode tcp
  option external-check
  external-check path "/usr/bin:/bin"
  external-check command /usr/local/bin/galera-check.sh
  stick-table type integer size 1
  stick on int(1)
  server data1 "${DATA1_IP}:3306" check
  server data2 "${DATA2_IP}:3306" check backup
  server data3 "${DATA3_IP}:3306" check backup

# The Redis primary: whichever member says `role:master`.
frontend redis
  mode tcp
  bind "${APP_VIP}:6379"
  bind "${LB_OWN_IP}:6379"
  default_backend redis

backend redis
  mode tcp
  option tcp-check
  tcp-check connect
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  tcp-check send info\ replication\r\n
  tcp-check expect string role:master
  tcp-check send QUIT\r\n
  tcp-check expect string +OK
  server data1 "${DATA1_IP}:6379" check
  server data2 "${DATA2_IP}:6379" check
  server data3 "${DATA3_IP}:6379" check

frontend stats
  mode http
  bind "127.0.0.1:8404"
  stats enable
  stats uri /
