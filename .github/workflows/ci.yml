name: CI

# One run per change, not two. A pull request is tested when it is opened and
# on every push to it, and there is deliberately no `push` trigger for `main`:
# with one, the same suite ran a second time the moment the PR merged. `main`
# is checked in full by the nightly run below, and by hand with "Run workflow"
# (`workflow_dispatch`) when a merge needs checking sooner. Keep "Require
# branches to be up to date before merging" on for `main`, so the run a PR
# passed was run against the code it merges into.
on:
  pull_request:
  workflow_dispatch:
  # S2-20 (issue #44): "a nightly full run and a per-PR smoke subset" — the
  # full `tests/sip` suite (every S1/S2 scenario, ~20+ tests, each with
  # real SIP transaction timers over real UDP) is too slow to gate every
  # PR on, but running only the fast S1-14 smoke subset (below) means a
  # regression in a less-frequently-touched scenario (a queue, a
  # conference room, voicemail, presence, ...) could sit undetected for a
  # long time between the PRs that happen to touch that exact area. A
  # nightly cron run is the middle ground: every scenario gets run at
  # least once a day without slowing down any individual PR. 06:00 UTC is
  # simply "outside any of this project's own working hours" — no
  # significance beyond that.
  schedule:
    - cron: '0 6 * * *'

# A new push to a PR makes the previous run irrelevant. Nightly and manual runs
# are never cancelled. Their ref is always `refs/heads/main`, so
# `github.event_name` in the group key keeps each kind in a lane of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Integration tests skip when no database or broker is reachable, so that
  # `pnpm test` stays usable on a laptop without Docker. In CI a missing
  # dependency must fail the run instead: without these, a broken service
  # container would report green with every integration test silently skipped.
  REQUIRE_DB_TESTS: '1'
  REQUIRE_NATS_TESTS: '1'
  REQUIRE_S3_TESTS: '1'
  REQUIRE_REDIS_TESTS: '1'
  REQUIRE_SMTP_TESTS: '1'
  TEST_DATABASE_URL: mysql://root:ci@127.0.0.1:3306
  TEST_S3_URL: http://ci-minio:ci-minio-password@127.0.0.1:9000
  TEST_REDIS_URL: redis://127.0.0.1:6379
  TEST_MAILPIT_URL: http://127.0.0.1:8025
  TEST_SMTP_HOST: 127.0.0.1
  TEST_SMTP_PORT: '1025'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: lint, typecheck, test, build
    # Self-hosted like `sip-smoke`: the runner is faster than GitHub-hosted
    # tenancy. It is a long-lived host, not a fresh VM, so anything a step
    # starts by hand must be removed again (see the MinIO step).
    runs-on: self-hosted
    timeout-minutes: 20

    services:
      mariadb:
        # Matches production (05 §1). A test that passes against a different
        # major is not evidence about production.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      mailpit:
        # notification-service's tests send through this and read what arrived
        # over its HTTP API (S3-03).
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget -qO- http://127.0.0.1:8025/readyz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          # Turbo's --affected compares against the base branch, so it needs
          # more than the tip commit.
          fetch-depth: 0

      - name: Install nats-server
        # Every suite that needs a bus starts its own JetStream server from this
        # binary (`packages/testing/src/nats.ts`), on a free port with its own
        # store. One shared server let two packages' tests, which turbo runs at
        # the same time, purge each other's `ORG`, `PBX` and `AUDIT` streams: an
        # event published by one was gone before its consumer pulled it, and the
        # test waited out its 15 s of retries and failed (G-17). The version
        # matches the `nats:2.10` line production runs.
        run: |
          version=v2.10.29
          sha256=e314da74a83a1d3876db8814c27eb990fe729640fd6452025b441bcede8390da
          dir="$RUNNER_TOOL_CACHE/nats-server/$version"
          if [ ! -x "$dir/nats-server" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/nats.tgz" \
              "https://github.com/nats-io/nats-server/releases/download/$version/nats-server-$version-linux-amd64.tar.gz"
            echo "$sha256  $tmp/nats.tgz" | sha256sum -c -
            tar -xzf "$tmp/nats.tgz" -C "$tmp"
            mkdir -p "$dir"
            install -m 0755 "$tmp/nats-server-$version-linux-amd64/nats-server" "$dir/nats-server.new"
            mv "$dir/nats-server.new" "$dir/nats-server"
            rm -rf "$tmp"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/nats-server" --version

      - name: Start MinIO
        # Not a `services:` entry: the image needs a `server /data` command,
        # and a service container has no way to pass one. Without this,
        # @cuc/storage's tests fall back to Testcontainers pulling the image
        # cold, which routinely outruns vitest's default hook timeout here.
        run: |
          docker rm -f minio >/dev/null 2>&1 || true
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-password \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; then
              echo "MinIO is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not start in time" >&2
          docker logs minio >&2
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      # On a pull request only the affected packages are built and tested; the
      # nightly and manual runs build and test everything, which is what says
      # `main` itself is green.
      #
      # `--affected` is safe here because turbo.json lists the root configs
      # (tsconfig.base.json, eslint.config.js, .prettierrc.json,
      # vitest.shared.ts, .nvmrc) as globalDependencies, so changing one marks
      # every package affected rather than none. If that list ever drifts, the
      # nightly full run is the backstop that catches it.
      - name: Lint, typecheck, test, build (affected)
        if: github.event_name == 'pull_request'
        env:
          # Without this, `--affected` reads the base branch's bare name from
          # the event, finds no local branch of that name (a PR checkout has
          # only `origin/<base>`), warns "unable to detect git range,
          # assuming all files have changed", and quietly runs every package.
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: pnpm exec turbo run lint typecheck test build --affected

      - name: Lint, typecheck, test, build (all)
        if: github.event_name != 'pull_request'
        run: pnpm check

      - name: Console OpenAPI snapshot is current
        # apps/console/api/openapi.json is dumped from the services' own route
        # schemas, and the console's contract test compares its screens against
        # it. Building every service `dump-openapi.mjs` imports (the seven in its
        # SOURCES list) first makes this independent of which packages
        # `--affected` happened to build above. Leave one out and the step only
        # fails on a pull request that does not touch that service.
        run: |
          pnpm exec turbo run build --filter=@cuc/pbx-config-service --filter=@cuc/callflow-service --filter=@cuc/identity-service --filter=@cuc/org-service --filter=@cuc/trunk-service --filter=@cuc/voicemail-service --filter=@cuc/cdr-service --filter=@cuc/api-gateway
          node apps/console/tool/dump-openapi.mjs
          git diff --exit-code -- apps/console/api/openapi.json

      - name: Console call-flow IR snapshot is current
        # apps/console/api/callflow-ir.json holds what the call-flow builder
        # must agree with @cuc/callflow-ir on (node schemas, ports, validator
        # verdicts); the console's tests compare the builder against it.
        run: |
          pnpm exec turbo run build --filter=@cuc/callflow-ir
          node apps/console/tool/dump-callflow-ir.mjs
          git diff --exit-code -- apps/console/api/callflow-ir.json

      - name: Brand-leak scan
        # Rule 1 in CLAUDE.md: no branding on any user-facing or network-visible
        # surface. Runs after build so it sees built artifacts as well as sources.
        run: pnpm brand-leak

      - name: Show MinIO logs on failure
        if: failure()
        run: docker logs minio || true

      - name: Remove MinIO
        # Not a `services:` entry, so the runner does not clean it up.
        if: always()
        run: docker rm -f minio || true

  # A separate job, not a step in `check` above, so one slow suite does not
  # hold up the fast feedback loop (real SIP transaction timers over real
  # UDP make this the slowest thing in the workflow). One job, not two
  # (`sip-smoke` + a separate nightly job): `schedule` and
  # `pull_request` never trigger the same workflow run, so there is no
  # concurrency to gain by splitting, and splitting would mean duplicating
  # every setup/build/compose-up/teardown/diagnostics step below. The run
  # step itself branches on `github.event_name` instead — same shape as the
  # `check` job's own affected-vs-all split above.
  sip-smoke:
    name: ${{ github.event_name == 'schedule' && 'SIP full suite (nightly, S2-20)' || 'SIP smoke (S1-14)' }}
    # Tried moving this to ubuntu-latest on 2026-09-22 to escape the
    # self-hosted runner's slow per-layer Docker overhead (see the timeout
    # comment below). Reverted the same day: the very first hosted run hit
    # G-34's exact documented signature (trunk registration stuck
    # 'unknown', a routing scenario timing out) instead of the layer-commit
    # slowness — hosted tenancy's 2 vCPUs still can't keep up with this
    # compose stack, which has only gotten heavier since G-34 and 84f3ec4
    # were written. Back to self-hosted; the layer-commit overhead is the
    # better problem to have.
    runs-on: self-hosted
    # Was 20. Confirmed live (2026-09-22): a single `pnpm ... --prod deploy
    # --legacy` step's own work finishes in ~5s, but the Docker layer
    # commit/export around it took ~260s on this runner — not a hang, just
    # this runner's per-layer overhead. Stage 2 added several new services
    # (call-control, callflow-service, voicemail-service) to the compose
    # stack in one batch, each needing a from-scratch, uncached image on
    # top of that overhead; 20 minutes was not enough headroom for the
    # whole stack to build even once nothing is actually stuck.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `tests/sip`'s own seed step (`run-scenario.ts`'s `seedFixtures`)
      # runs `dist/src/seed.js` inside a throwaway container that bind-mounts
      # this checkout — it needs the compiled output on disk, not just a
      # turbo cache entry elsewhere, so this must happen before the stack
      # comes up.
      - name: Build tests/sip and its workspace dependencies
        run: pnpm exec turbo run build --filter=@cuc/tests-sip...

      # `--wait` blocks until every service satisfies its own
      # `depends_on: condition:` (S1-14's own compose file) or, for FS/
      # OpenSIPs, the Docker-level `HEALTHCHECK` baked into their own
      # Dockerfiles — the same readiness signal `make up` relies on locally.
      - name: Build and start the compose stack
        working-directory: infra/compose
        run: |
          # Clean slate first. This compose project's name is fixed
          # (`name: conductor-uc`), so every SIP smoke job on this
          # self-hosted runner shares one project, one network and one set
          # of container names. The runner serializes jobs, but only just:
          # observed live on 2026-09-22, one job started **one second**
          # after the previous job's `docker compose down -v` step
          # finished, and its whole run then failed with
          # `getaddrinfo EAI_AGAIN mariadb` — every test file, including
          # the seed step, unable to resolve anything on the compose
          # network, because the previous teardown was still removing that
          # network while this `up` recreated it.
          #
          # `down -v` here is idempotent (a no-op when nothing is left) and
          # synchronous, so `up` below always starts from a settled state
          # rather than racing whatever the previous job left mid-removal.
          docker compose down -v --remove-orphans
          docker compose build
          docker compose up -d --wait --wait-timeout 180

      # S2-20 (issue #44): every PR (or manual) run gets only the original S1-14
      # smoke subset (`scenarios.test.ts` — the job's own name predates this
      # split and still describes exactly this step). The full suite (this
      # file plus conference/queue/voicemail/presence/parking/... — every
      # S1/S2 scenario) only runs on the nightly `schedule` trigger, below.
      # Same `if:`-branch-on-event_name shape as the `check` job's own
      # affected-vs-all split above.
      - name: Run SIP smoke scenarios
        if: github.event_name != 'schedule'
        working-directory: tests/sip
        env:
          # A missing/broken compose stack must fail this job, not report a
          # green run full of skipped tests — same pattern as the `check`
          # job's own REQUIRE_DB_TESTS etc. above.
          REQUIRE_SIP_TESTS: '1'
        run: pnpm vitest run test/scenarios.test.ts

      - name: Run full SIP suite (nightly)
        if: github.event_name == 'schedule'
        working-directory: tests/sip
        env:
          REQUIRE_SIP_TESTS: '1'
        run: pnpm vitest run

      # The recurring flake this suite keeps hitting (docs/decisions.md
      # G-39) is a call whose BYE never reaches the UAS, with FreeSWITCH's
      # own log showing neither leg ever torn down. `docker compose logs`
      # below cannot answer the question that would actually root-cause it:
      # what FS itself thought the state was at the moment of failure.
      # These three do, and cost nothing on a passing run.
      #
      # S2-19: both nodes, not just the first — round-robin dispatch means
      # a stuck call could be on either one, the same reasoning
      # `tests/sip/src/setup.ts`'s own `fsCliAll` now applies per-test.
      - name: Show FreeSWITCH call state on failure
        if: failure()
        run: |
          fs() {
            container="$1"; shift
            docker exec "$container" fs_cli -H 127.0.0.1 -P 8021 \
              -p "${FS_EVENT_SOCKET_PASSWORD:-dev-event-socket-password}" -x "$1" || true
          }
          for container in conductor-uc-freeswitch-1 conductor-uc-freeswitch-2-1; do
            echo "=== $container ==="
            echo '--- channels still up (a stuck call shows here) ---'
            fs "$container" 'show channels'
            echo '--- registrations (is the UAS even registered where FS thinks?) ---'
            fs "$container" 'sofia status profile internal reg'
            echo '--- sofia profile state ---'
            fs "$container" 'sofia status'
          done

      - name: Show compose logs on failure
        if: failure()
        working-directory: infra/compose
        run: docker compose logs

      - name: Tear down the compose stack
        if: always()
        working-directory: infra/compose
        run: docker compose down -v

  # The Flutter console (D-001): not a pnpm workspace member, so it has its own
  # job. brand-leak runs here, after `flutter build web`, because that is the
  # only place `apps/console/build/web` exists to be scanned.
  console:
    name: console (analyze, test, build web)
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # `runs-on: self-hosted` can land on more than one runner, and a runner
      # that starts its jobs with no HOME (seen on `runner-1`) stops
      # flutter-action's setup script with "HOME: unbound variable" before it does
      # anything. Give the rest of the job a HOME when it has none; where there is
      # one (the `dell` runner) this leaves it exactly as it was.
      - name: Make sure HOME is set
        run: |
          home="${HOME:-$RUNNER_TEMP/home}"
          mkdir -p "$home"
          echo "HOME=$home" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate the API client and check it is committed
        # The client is generated from api/openapi.yaml (08 §1). A stale
        # checked-in copy would let the spec and the app drift apart.
        working-directory: apps/console
        env:
          OPENAPI_GENERATOR_JAR: ${{ runner.temp }}/openapi-generator-cli.jar
        run: |
          curl -fsSL -o "$OPENAPI_GENERATOR_JAR" \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.14.0/openapi-generator-cli-7.14.0.jar
          ./tool/generate-api.sh
          git diff --exit-code -- packages/console_api

      - run: flutter pub get
        working-directory: apps/console

      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/console

      - run: flutter analyze
        working-directory: apps/console

      - run: flutter test
        working-directory: apps/console

      # Built the way production serves it (G-104): CanvasKit bundled, so the
      # gateway's Content-Security-Policy needs no CDN in it.
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: apps/console

      - run: pnpm install --frozen-lockfile

      - name: Brand-leak scan (includes build/web)
        run: pnpm brand-leak

  # Later stages plug in here rather than in the job above:
  #   - container image builds, pushed on main (S1)
