# Local development stack (S0-05). MariaDB, Redis, NATS (JetStream), MinIO,
# Mailpit, and (from S1-10/S1-11) FreeSWITCH and OpenSIPs. Both projections
# (usrloc, dispatcher, domain, ...) are empty until telephony-config (S1-12)
# exists — every routing decision in opensips.cfg.template correctly finds
# nothing and falls through until then.
#
# Usage: see the root Makefile (`make up` / `make down` / `make reset`) or
# ./README.md for details and troubleshooting.
name: conductor-uc

services:
  mariadb:
    # Matches production and CI (05 §1, .github/workflows/ci.yml): a test or
    # a dev session against a different major is not evidence about prod.
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-dev-root-password}
      IDENTITY_SERVICE_DB_PASSWORD: ${IDENTITY_SERVICE_DB_PASSWORD:-dev-identity-password}
      ORG_SERVICE_DB_PASSWORD: ${ORG_SERVICE_DB_PASSWORD:-dev-org-password}
      PBX_CONFIG_SERVICE_DB_PASSWORD: ${PBX_CONFIG_SERVICE_DB_PASSWORD:-dev-pbx-config-password}
      EXAMPLE_SERVICE_DB_PASSWORD: ${EXAMPLE_SERVICE_DB_PASSWORD:-dev-example-password}
      TELEPHONY_CONFIG_SERVICE_DB_PASSWORD: ${TELEPHONY_CONFIG_SERVICE_DB_PASSWORD:-dev-telephony-config-password}
      TRUNK_SERVICE_DB_PASSWORD: ${TRUNK_SERVICE_DB_PASSWORD:-dev-trunk-service-password}
      MEDIA_WORKER_DB_PASSWORD: ${MEDIA_WORKER_DB_PASSWORD:-dev-media-worker-password}
      CALL_CONTROL_DB_PASSWORD: ${CALL_CONTROL_DB_PASSWORD:-dev-call-control-password}
      CALLFLOW_SERVICE_DB_PASSWORD: ${CALLFLOW_SERVICE_DB_PASSWORD:-dev-callflow-service-password}
      VOICEMAIL_SERVICE_DB_PASSWORD: ${VOICEMAIL_SERVICE_DB_PASSWORD:-dev-voicemail-service-password}
      CDR_SERVICE_DB_PASSWORD: ${CDR_SERVICE_DB_PASSWORD:-dev-cdr-service-password}
      NOTIFICATION_SERVICE_DB_PASSWORD: ${NOTIFICATION_SERVICE_DB_PASSWORD:-dev-notification-service-password}
      OPENSIPS_DB_PASSWORD: ${OPENSIPS_DB_PASSWORD:-dev-opensips-password}
    ports:
      - '${MARIADB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
      # Only runs against an empty data directory (the image's own rule), so
      # editing this after the first `make up` needs `make reset` to apply.
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      # S1-11: OpenSIPs' own vendored table-creation SQL, read by
      # 02-opensips-schema.sh above (see telephony/opensips/db-schema/README.md).
      - ../../telephony/opensips/db-schema:/opensips-schema:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # -js enables JetStream (D-004); -sd points its store at the volume so
    # streams survive a restart; -m exposes the monitoring/health endpoint.
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # The image wires its own `mc` client to a `local` alias against its
      # own server, so this needs no extra setup.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  freeswitch:
    # S1-10. telephony/freeswitch's own Dockerfile builds a minimal, neutral
    # image from scratch — see it for why (the upstream package repo now
    # requires authentication).
    build:
      context: ../../telephony/freeswitch
    restart: unless-stopped
    environment:
      # Compose's default bridge subnet is assigned dynamically, so this is
      # deliberately broad rather than one fixed address — it still only
      # covers this project's own isolated network, never the host's.
      FS_OPENSIPS_CIDR: ${FS_OPENSIPS_CIDR:-172.16.0.0/12}
      FS_CLUSTER_CIDR: ${FS_CLUSTER_CIDR:-172.16.0.0/12}
      FS_EVENT_SOCKET_PASSWORD: ${FS_EVENT_SOCKET_PASSWORD:-dev-event-socket-password}
      TELEPHONY_CONFIG_URL: ${TELEPHONY_CONFIG_URL:-http://telephony-config:8080}
      FS_XML_CURL_TOKEN: ${FS_XML_CURL_TOKEN:-dev-internal-token}
      CDR_SERVICE_URL: ${CDR_SERVICE_URL:-http://cdr-service:8080}
      FS_CDR_INGEST_TOKEN: ${FS_CDR_INGEST_TOKEN:-dev-cdr-ingest-token}
      # S2-12: must match the id half of call-control's own `FS_NODES` entry
      # for this node (below: `freeswitch:freeswitch:8021`).
      FS_NODE_ID: ${FS_NODE_ID:-freeswitch}
      # S2-05: mod_redis (the "redis" `limit` backend) — the container-
      # internal port, not `REDIS_PORT` (that one's the *host*-side mapping,
      # same distinction `OPENSIPS_DB_URL`'s own `mariadb:3306` already
      # makes for the DB).
      FS_REDIS_HOST: ${FS_REDIS_HOST:-redis}
      FS_REDIS_PORT: ${FS_REDIS_PORT:-6379}
    # No host port publish: 03 §1's table lists OpenSIPs as the only edge —
    # FS is reached over the compose network (its ACL only allows
    # opensips_cidr/cluster_cidr, S1-10), same as production. The dispatcher
    # module (below) is what actually sends it traffic.
    tmpfs:
      # 06's recording pipeline spool. Never a named volume — nothing
      # durable lives on a FreeSWITCH node (CLAUDE.md rule 5).
      - /var/spool/cuc/rec
      # S2-10's flow-IR cache. tmpfs for the same reason, and losing it costs
      # nothing: the runner fetches the IR on every call anyway, and only
      # falls back to this cache when callflow-service is unreachable.
      - /var/cache/cuc/flow
      # `mod_http_cache`'s own on-disk cache (`http_cache.conf.xml`, G-47) —
      # same "nothing durable on a node" reasoning; a cache miss just
      # re-fetches over HTTP.
      - /var/cache/cuc/http

  freeswitch-2:
    # S2-19: a second, identically-configured FS node — same image, same
    # shared services (telephony-config, cdr-service, redis), only its own
    # node identity differs (`FS_NODE_ID_2`, below). Proves "any node serves
    # any tenant" (D-009/D-011's own framing) rather than assuming it:
    # OpenSIPs' dispatcher (`OPENSIPS_FS_DESTINATION`, below) round-robins
    # real SIP traffic across both from here on, not just this one.
    build:
      context: ../../telephony/freeswitch
    restart: unless-stopped
    environment:
      FS_OPENSIPS_CIDR: ${FS_OPENSIPS_CIDR:-172.16.0.0/12}
      FS_CLUSTER_CIDR: ${FS_CLUSTER_CIDR:-172.16.0.0/12}
      FS_EVENT_SOCKET_PASSWORD: ${FS_EVENT_SOCKET_PASSWORD:-dev-event-socket-password}
      TELEPHONY_CONFIG_URL: ${TELEPHONY_CONFIG_URL:-http://telephony-config:8080}
      FS_XML_CURL_TOKEN: ${FS_XML_CURL_TOKEN:-dev-internal-token}
      CDR_SERVICE_URL: ${CDR_SERVICE_URL:-http://cdr-service:8080}
      FS_CDR_INGEST_TOKEN: ${FS_CDR_INGEST_TOKEN:-dev-cdr-ingest-token}
      # Must match the id half of call-control's own second `FS_NODES` entry
      # (below: `freeswitch-2:freeswitch-2:8021`) and this service's own
      # compose hostname (`freeswitch-2`), which `OPENSIPS_FS_DESTINATION`
      # also has to agree with.
      FS_NODE_ID: ${FS_NODE_ID_2:-freeswitch-2}
      FS_REDIS_HOST: ${FS_REDIS_HOST:-redis}
      FS_REDIS_PORT: ${FS_REDIS_PORT:-6379}
    tmpfs:
      - /var/spool/cuc/rec
      - /var/cache/cuc/flow
      - /var/cache/cuc/http

  opensips:
    # S1-11. telephony/opensips's own Dockerfile builds this from the
    # upstream opensips/opensips:3.6 image plus the extra modules 03 §2
    # needs — see it and opensips.cfg.template for the module-by-module
    # reasoning.
    build:
      context: ../../telephony/opensips
    restart: unless-stopped
    depends_on:
      mariadb:
        # The `opensips` schema (mariadb/init/01-schemas.sh,
        # 02-opensips-schema.sh) must exist before db_mysql-backed modules
        # try to connect at startup.
        condition: service_healthy
    environment:
      OPENSIPS_LOG_LEVEL: ${OPENSIPS_LOG_LEVEL:-3}
      OPENSIPS_IDENTITY: ${OPENSIPS_IDENTITY:-SIP Media Server}
      OPENSIPS_SIP_PORT: ${OPENSIPS_SIP_PORT:-5060}
      OPENSIPS_MI_PORT: ${OPENSIPS_MI_PORT:-8888}
      OPENSIPS_DB_URL: mysql://opensips:${OPENSIPS_DB_PASSWORD:-dev-opensips-password}@mariadb/opensips
      OPENSIPS_REDIS_URL: ${OPENSIPS_REDIS_URL:-redis:cuc://redis:6379/0}
      # S1-14 (G-18): seeded into `dispatcher` set 1 at container start
      # (seed-dispatcher.py, comma-separated since S2-19's second node) —
      # `route{}` also uses this same set (`ds_is_from_list("1")`) to tell a
      # request FS sent back to us (ext→ext, 03 §2.1) apart from a
      # registered phone dialing out — a CIDR check was tried first and
      # confirmed wrong on this flat compose network (opensips.cfg.template's
      # own comment). `ds_select_dst(1, 4)`'s algorithm 4 is round robin, so
      # this is also what actually spreads calls across both nodes.
      OPENSIPS_FS_DESTINATION: ${OPENSIPS_FS_DESTINATION:-sip:freeswitch:5060,sip:freeswitch-2:5060}
      # S2-02: fast in dev/test so a newly created trunk registers within
      # seconds rather than the module's ~100-200s default worst case.
      OPENSIPS_REGISTRANT_TIMER_INTERVAL: ${OPENSIPS_REGISTRANT_TIMER_INTERVAL:-10}
      # 07 §5: SIP over TLS on 5061. Dev makes its own self-signed certificate
      # for the platform's test domains the first time it starts, and keeps it
      # in the volume below. A real deployment mounts a real certificate here
      # and leaves the self-signed switch off (no phone trusts a self-signed one).
      OPENSIPS_TLS_CERT_FILE: ${OPENSIPS_TLS_CERT_FILE:-/etc/opensips/tls/cert.pem}
      OPENSIPS_TLS_KEY_FILE: ${OPENSIPS_TLS_KEY_FILE:-/etc/opensips/tls/key.pem}
      OPENSIPS_TLS_DEV_SELF_SIGNED: ${OPENSIPS_TLS_DEV_SELF_SIGNED:-true}
      OPENSIPS_TLS_DEV_NAMES: ${OPENSIPS_TLS_DEV_NAMES:-platform.test,*.platform.test}
    volumes:
      - opensips-tls:/etc/opensips/tls
    ports:
      - '${OPENSIPS_SIP_PORT:-5060}:5060/udp'
      - '${OPENSIPS_SIP_PORT:-5060}:5060/tcp'
      - '${OPENSIPS_TLS_PORT:-5061}:5061/tcp'

  org-service:
    # S1-14: the first Node service to actually run in this stack (09 §1's
    # "each service builds a single container image", never exercised until
    # a task needed real cross-service HTTP + event flow, not just each
    # service's own integration tests). `identity-service` deliberately does
    # not run here — tests/sip provisions fixtures through this service's
    # own repo layer directly (bypassing the admin-user side effect on
    # `POST /v1/.../tenants`, which SIP scenarios have no use for), so
    # nothing in this stack ever calls out to it.
    build:
      context: ../..
      dockerfile: services/org-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      SERVICE_NAME: org-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: org_service
      DB_PASSWORD: ${ORG_SERVICE_DB_PASSWORD:-dev-org-password}
      DB_NAME: org_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # G-60: these services sit behind api-gateway, which signs who is calling.
      TRUST_INTERNAL_HEADERS: 'true'
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      # Unreachable on purpose (see the note above) — org-service's own
      # config still requires a syntactically valid URL to boot.
      IDENTITY_SERVICE_URL: http://127.0.0.1:1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # G-105: the certificates org-service keeps have their private keys
      # envelope-encrypted with this. Dev-only key (packages/crypto/src/config.ts);
      # production uses a KMS.
      CRYPTO_KEKS: ${CRYPTO_KEKS:-1:u4SpMlDTAL6cVMC2rzCxhoKCRAJxpgoc7h+hX3OfdfY=}
      CRYPTO_KEK_CURRENT: '1'
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-platform.test}
      STORAGE_BUCKET_PREFIX: cuc-dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-minio}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
      STORAGE_FORCE_PATH_STYLE: 'true'

  pbx-config-service:
    build:
      context: ../..
      dockerfile: services/pbx-config-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      org-service:
        condition: service_started
      trunk-service:
        condition: service_started
    environment:
      SERVICE_NAME: pbx-config-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: pbx_config_service
      DB_PASSWORD: ${PBX_CONFIG_SERVICE_DB_PASSWORD:-dev-pbx-config-password}
      DB_NAME: pbx_config_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # G-60: these services sit behind api-gateway, which signs who is calling.
      TRUST_INTERNAL_HEADERS: 'true'
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      ORG_SERVICE_URL: http://org-service:8080
      TRUNK_SERVICE_URL: http://trunk-service:8080
      # G-103: phones fetch their settings from the gateway's own address. On a
      # laptop that is the published gateway port; set this to the address the
      # phones can actually reach.
      # 07 §5: the edge offers SIP over TLS on 5061 as well as UDP and TCP on 5060.
      # Most preferred first. Dev lists TLS last because its certificate is self-
      # signed, which no phone trusts; production puts `tls` first.
      SIP_PUBLIC_TRANSPORTS: ${SIP_PUBLIC_TRANSPORTS:-udp,tcp,tls}
      PROVISIONING_BASE_URL: ${PROVISIONING_BASE_URL:-http://localhost:8080}
      # G-103: the platform-wide user name and password phones use (HTTP Basic).
      # Dev-only defaults; production sets its own.
      PROVISIONING_USERNAME: ${PROVISIONING_USERNAME:-phones}
      PROVISIONING_PASSWORD: ${PROVISIONING_PASSWORD:-dev-provisioning-password}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Dev-only KEK (packages/crypto/src/config.ts) — production uses a KMS.
      CRYPTO_KEKS: ${CRYPTO_KEKS:-1:u4SpMlDTAL6cVMC2rzCxhoKCRAJxpgoc7h+hX3OfdfY=}
      CRYPTO_KEK_CURRENT: '1'
      # S2-07: media-asset uploads land here (presigned PUT), same bucket
      # story org-service's own brand assets already use.
      STORAGE_BUCKET_PREFIX: cuc-dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-minio}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
      STORAGE_FORCE_PATH_STYLE: 'true'

  trunk-service:
    build:
      context: ../..
      dockerfile: services/trunk-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      org-service:
        condition: service_started
    environment:
      SERVICE_NAME: trunk-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: trunk_service
      DB_PASSWORD: ${TRUNK_SERVICE_DB_PASSWORD:-dev-trunk-service-password}
      DB_NAME: trunk_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # G-60: these services sit behind api-gateway, which signs who is calling.
      TRUST_INTERNAL_HEADERS: 'true'
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      ORG_SERVICE_URL: http://org-service:8080
      TELEPHONY_CONFIG_URL: http://telephony-config:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Dev-only KEK (packages/crypto/src/config.ts) — production uses a KMS.
      CRYPTO_KEKS: ${CRYPTO_KEKS:-1:u4SpMlDTAL6cVMC2rzCxhoKCRAJxpgoc7h+hX3OfdfY=}
      CRYPTO_KEK_CURRENT: '1'

  telephony-config:
    build:
      context: ../..
      dockerfile: services/telephony-config/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      org-service:
        condition: service_started
      pbx-config-service:
        condition: service_started
      trunk-service:
        condition: service_started
      voicemail-service:
        condition: service_started
      callflow-service:
        condition: service_started
      call-control:
        condition: service_started
    environment:
      SERVICE_NAME: telephony-config
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: telephony_config
      DB_PASSWORD: ${TELEPHONY_CONFIG_SERVICE_DB_PASSWORD:-dev-telephony-config-password}
      DB_NAME: telephony_config
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      OPENSIPS_DB_HOST: mariadb
      OPENSIPS_DB_PORT: 3306
      OPENSIPS_DB_USER: opensips
      OPENSIPS_DB_PASSWORD: ${OPENSIPS_DB_PASSWORD:-dev-opensips-password}
      OPENSIPS_DB_NAME: opensips
      OPENSIPS_MI_URL: http://opensips:${OPENSIPS_MI_PORT:-8888}/mi
      OPENSIPS_SIP_URI: opensips:${OPENSIPS_SIP_PORT:-5060}
      PBX_CONFIG_SERVICE_URL: http://pbx-config-service:8080
      TRUNK_SERVICE_URL: http://trunk-service:8080
      STORAGE_BUCKET_PREFIX: cuc-dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-minio}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
      STORAGE_FORCE_PATH_STYLE: 'true'
      ORG_SERVICE_URL: http://org-service:8080
      VOICEMAIL_SERVICE_URL: http://voicemail-service:8080
      CALLFLOW_SERVICE_URL: http://callflow-service:8080
      # S2-13: `handleQueueDial`'s own synchronous affinity-acquire call.
      CALL_CONTROL_URL: http://call-control:8080
      # S2-13: must match the freeswitch service's own TELEPHONY_CONFIG_URL
      # default above — this service's own address, from FS's perspective.
      SELF_URL: http://telephony-config:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      FS_XML_CURL_TOKEN: ${FS_XML_CURL_TOKEN:-dev-internal-token}
      RECONCILE_INTERVAL_MS: '900000'
      REDIS_URL: redis://redis:6379
      # S2-12: must match call-control's own REDIS_KEY_PREFIX exactly — both
      # default to 'cuc:dev:' already, set explicitly here so the dependency
      # is visible rather than incidental.
      REDIS_KEY_PREFIX: 'cuc:dev:'

  media-worker:
    # S2-07: isolated from pbx-config-service on purpose — the one service
    # in this stack that runs `ffmpeg` against tenant-uploaded, untrusted
    # audio (`services/media-worker/Dockerfile`'s own doc comment).
    build:
      context: ../..
      dockerfile: services/media-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      pbx-config-service:
        condition: service_started
    environment:
      SERVICE_NAME: media-worker
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: media_worker
      DB_PASSWORD: ${MEDIA_WORKER_DB_PASSWORD:-dev-media-worker-password}
      DB_NAME: media_worker
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      PBX_CONFIG_SERVICE_URL: http://pbx-config-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      STORAGE_BUCKET_PREFIX: cuc-dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-minio}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
      STORAGE_FORCE_PATH_STYLE: 'true'

  call-control:
    # S2-11. Speaks ESL to every configured FreeSWITCH node and owns the
    # Redis call/node registry (04 §3) — no object storage, no tenant
    # secrets, unlike its siblings above.
    #
    # Restored here: this whole block (everything past `build:`) was lost
    # when PR #132 (S2-11) merged into main — an adjacent-service-block
    # merge/rebase mistake, the same failure mode as the voicemail-service
    # corruption this PR's own rebase hit and fixed below. Found live: a
    # `docker compose build`/`up` against main as of this PR's own rebase
    # fails outright (`docker compose config` errors on structurally
    # malformed YAML from the same cause). Restored from S2-11's own
    # pre-merge branch tip (commit 8f8710d) verbatim.
    build:
      context: ../..
      dockerfile: services/call-control/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      freeswitch:
        condition: service_started
      freeswitch-2:
        condition: service_started
    environment:
      SERVICE_NAME: call-control
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: call_control
      DB_PASSWORD: ${CALL_CONTROL_DB_PASSWORD:-dev-call-control-password}
      DB_NAME: call_control
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: 'cuc:dev:'
      # S2-19: two nodes now (`main.ts`'s own comment: this was "a list from
      # the start... so that task is a compose/env change only" — it was).
      FS_NODES: freeswitch:freeswitch:8021,freeswitch-2:freeswitch-2:8021
      # Matches the `freeswitch` service's own FS_EVENT_SOCKET_PASSWORD
      # default above (telephony/freeswitch/conf/vars.xml) — both must agree
      # for auth to succeed; there is one shared value in dev, same as
      # `FS_XML_CURL_TOKEN`'s pattern elsewhere in this file.
      FS_EVENT_SOCKET_PASSWORD: ${FS_EVENT_SOCKET_PASSWORD:-dev-event-socket-password}
      # S2-12: `/internal/v1/affinity/...`'s own gate (07 §1's precedent) —
      # same shared value every other service's own INTERNAL_SERVICE_TOKEN uses.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}

  callflow-service:
    build:
      context: ../..
      dockerfile: services/callflow-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      SERVICE_NAME: callflow-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: callflow_service
      DB_PASSWORD: ${CALLFLOW_SERVICE_DB_PASSWORD:-dev-callflow-service-password}
      DB_NAME: callflow_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # G-60: these services sit behind api-gateway, which signs who is calling.
      TRUST_INTERNAL_HEADERS: 'true'
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}

  voicemail-service:
    build:
      context: ../..
      dockerfile: services/voicemail-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: voicemail-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: voicemail_service
      DB_PASSWORD: ${VOICEMAIL_SERVICE_DB_PASSWORD:-dev-voicemail-service-password}
      DB_NAME: voicemail_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # G-60: these services sit behind api-gateway, which signs who is calling.
      TRUST_INTERNAL_HEADERS: 'true'
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Dev-only KEK (packages/crypto/src/config.ts) — production uses a KMS.
      CRYPTO_KEKS: ${CRYPTO_KEKS:-1:u4SpMlDTAL6cVMC2rzCxhoKCRAJxpgoc7h+hX3OfdfY=}
      CRYPTO_KEK_CURRENT: '1'
      STORAGE_BUCKET_PREFIX: cuc-dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-minio}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
      STORAGE_FORCE_PATH_STYLE: 'true'

  cdr-service:
    build:
      context: ../..
      dockerfile: services/cdr-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: cdr-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: cdr_service
      DB_PASSWORD: ${CDR_SERVICE_DB_PASSWORD:-dev-cdr-service-password}
      DB_NAME: cdr_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # G-60: these services sit behind api-gateway, which signs who is calling.
      TRUST_INTERNAL_HEADERS: 'true'
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      ORG_SERVICE_URL: ${ORG_SERVICE_URL:-http://org-service:8080}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # `mod_json_cdr`'s own shared token (`telephony/freeswitch/conf/vars.xml`'s
      # `cdr_service_token`) — must match `FS_CDR_INGEST_TOKEN` above on the
      # `freeswitch` service, same "one shared value in dev" pattern
      # `FS_XML_CURL_TOKEN` already establishes for telephony-config.
      FS_CDR_INGEST_TOKEN: ${FS_CDR_INGEST_TOKEN:-dev-cdr-ingest-token}
      STORAGE_BUCKET_PREFIX: cuc-dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-minio}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
      STORAGE_FORCE_PATH_STYLE: 'true'

  # S3-03. Consumes identity's reset and invitation events and sends the email
  # through Mailpit. Links point at the console at CONSOLE_URL_OVERRIDE when set
  # (a local `flutter run` or a served build), otherwise at
  # https://console.$PLATFORM_BASE_DOMAIN.
  identity-service:
    # G-60: signs users in and issues the access tokens api-gateway verifies.
    build:
      context: ../..
      dockerfile: services/identity-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      org-service:
        condition: service_started
    environment:
      SERVICE_NAME: identity-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: identity_service
      DB_PASSWORD: ${IDENTITY_SERVICE_DB_PASSWORD:-dev-identity-password}
      DB_NAME: identity_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      TRUST_INTERNAL_HEADERS: 'true'
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      ORG_SERVICE_URL: http://org-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Dev-only KEK (packages/crypto/src/config.ts) — production uses a KMS.
      CRYPTO_KEKS: ${CRYPTO_KEKS:-1:u4SpMlDTAL6cVMC2rzCxhoKCRAJxpgoc7h+hX3OfdfY=}
      CRYPTO_KEK_CURRENT: '1'
      # Plain HTTP on a laptop: a browser would refuse a Secure cookie.
      COOKIE_SECURE: 'false'

  api-gateway:
    # G-60: the one public entry point. Verifies the access token, then sends
    # each path to the service that owns it (ROUTE_TABLE, most specific first).
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      org-service:
        condition: service_started
      pbx-config-service:
        condition: service_started
      callflow-service:
        condition: service_started
      voicemail-service:
        condition: service_started
      cdr-service:
        condition: service_started
      trunk-service:
        condition: service_started
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    environment:
      SERVICE_NAME: api-gateway
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      INTERNAL_HEADER_SIGNING_SECRET: ${INTERNAL_HEADER_SIGNING_SECRET:-dev-internal-header-signing-secret}
      REDIS_URL: redis://redis:6379
      IDENTITY_SERVICE_URL: http://identity-service:8080
      ORG_SERVICE_URL: http://org-service:8080
      PBX_CONFIG_SERVICE_URL: http://pbx-config-service:8080
      CALLFLOW_SERVICE_URL: http://callflow-service:8080
      VOICEMAIL_SERVICE_URL: http://voicemail-service:8080
      CDR_SERVICE_URL: http://cdr-service:8080
      TRUNK_SERVICE_URL: http://trunk-service:8080
      # 07 §5: the edge speaks HTTPS when it is given a certificate, and refuses to
      # serve phone provisioning (which carries a SIP password) over plain HTTP.
      # A laptop runs plain HTTP, so dev turns both off; production sets
      # TLS_CERT_FILE / TLS_KEY_FILE (or TLS_CERT_DIR) and leaves them on.
      REQUIRE_HTTPS_FOR_PROVISIONING: ${REQUIRE_HTTPS_FOR_PROVISIONING:-false}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-0}

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      nats:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SERVICE_NAME: notification-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: notification_service
      DB_PASSWORD: ${NOTIFICATION_SERVICE_DB_PASSWORD:-dev-notification-service-password}
      DB_NAME: notification_service
      NATS_SERVERS: nats://nats:4222
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      ORG_SERVICE_URL: ${ORG_SERVICE_URL:-http://org-service:8080}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PLATFORM_NOREPLY_ADDRESS: ${PLATFORM_NOREPLY_ADDRESS:-noreply@local.test}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-local.test}
      CONSOLE_LINK_SCHEME: ${CONSOLE_LINK_SCHEME:-http}
      CONSOLE_URL_OVERRIDE: ${CONSOLE_URL_OVERRIDE:-}

volumes:
  opensips-tls:
  mariadb-data:
  redis-data:
  nats-data:
  minio-data:
  mailpit-data:
