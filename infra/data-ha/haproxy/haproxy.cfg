# S4-07 (10 §4.1, D-017): the addresses the services use for the data tier.
# A production pair runs two of these behind one keepalived address (S4-11).
global
  log stdout format raw local0 notice
  external-check
  insecure-fork-wanted

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

defaults
  mode tcp
  log global
  timeout connect 2s
  timeout client 1h
  timeout server 1h
  default-server resolvers docker init-addr last,libc,none inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

# The MariaDB writer (D-016): one member at a time. The others are backups the
# check switches to when the writer stops being Synced; the stick table keeps
# writes on the new writer when the old one comes back, rather than moving
# them again.
frontend mariadb
  bind :3306
  default_backend galera

backend galera
  option external-check
  external-check path "/usr/bin:/bin"
  external-check command /usr/local/bin/galera-check.sh
  stick-table type integer size 1
  stick on int(1)
  server galera-1 galera-1:3306 check
  server galera-2 galera-2:3306 check backup
  server galera-3 galera-3:3306 check backup

# The Redis primary: whichever member says `role:master` (Sentinel promotes a
# replica when the primary dies). FreeSWITCH's mod_redis and OpenSIPs'
# cachedb_redis take one address and cannot follow Sentinel themselves.
frontend redis
  bind :6379
  default_backend redis

backend redis
  option tcp-check
  tcp-check connect
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  tcp-check send info\ replication\r\n
  tcp-check expect string role:master
  tcp-check send QUIT\r\n
  tcp-check expect string +OK
  server redis-1 redis-1:6379 check
  server redis-2 redis-2:6379 check
  server redis-3 redis-3:6379 check

frontend stats
  mode http
  bind :8404
  stats enable
  stats uri /
